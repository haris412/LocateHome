@if (state().isOpen && overlayData(); as data) {
  <app-appointment-overlay
    [open]="state().isOpen"
    [data]="data"
    (closed)="closeAppointmentOverlay()"
    (confirmed)="confirmAppointment($event)"
  />
}

@if (moreFiltersState().isOpen && moreFiltersData(); as data) {
  <app-more-filters-overlay
    [data]="data"
    (closed)="closeMoreFiltersOverlay()"
    (applied)="applyMoreFilters($event)" />
}
