<div class="location-search-field">
  <label class="location-search-field__label">
    <span>{{ label() }}</span>
  </label>

  <mat-form-field appearance="outline" class="location-search-field__field" subscriptSizing="dynamic">
    <mat-icon matPrefix fontSet="material-symbols-outlined" aria-hidden="true">
      {{ icon() }}
    </mat-icon>

    <input
      type="text"
      matInput
      [placeholder]="placeholder()"
      [matAutocomplete]="auto"
      [value]="draft()"
      (input)="onInput($event)"
    />

    <mat-icon matSuffix fontSet="material-symbols-outlined" aria-hidden="true">
      search
    </mat-icon>

    <mat-autocomplete
      #auto="matAutocomplete"
      [displayWith]="toDisplayName"
      (optionSelected)="onOptionSelected($event)"
    >
      @for (pred of suggestions(); track pred.placeId) {
        <mat-option [value]="pred">
          <span class="lc-place-main">{{ pred.structuredFormat.mainText.text }}</span>
          @if (pred.structuredFormat.secondaryText?.text) {
            <span class="lc-place-secondary">{{ pred.structuredFormat.secondaryText!.text }}</span>
          }
        </mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>
</div>
