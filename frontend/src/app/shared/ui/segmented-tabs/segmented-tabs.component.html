<div class="segmented-tabs"
     role="tablist"
     [attr.aria-label]="ariaLabel()"
     [style.--segmented-tab-count]="tabs().length">
  <div
    class="segmented-tabs__pill"
    [ngStyle]="pillStyle()"
    aria-hidden="true"
  ></div>

  @for (tab of tabs(); track tab.id) {
  <button type="button"
          role="tab"
          class="segmented-tabs__button"
          [class.segmented-tabs__button--active]="visualActive() === tab.id"
          [attr.aria-selected]="active() === tab.id"
          [attr.tabindex]="active() === tab.id ? 0 : -1"
          (click)="selectTab(tab.id)">
    {{ tab.label }}
  </button>
  }
</div>
