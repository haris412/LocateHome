<div class="home-page">
  <section class="home-page__hero-band">
    <app-hero-section
      backgroundImageUrl="assets/images/home/hero-section.jpg"
      title="Discover Your Perfect Home"
      subtitle="Watch guided video tours of exclusive properties tailored to your lifestyle.">
      <app-search-panel hero-search (search)="onSearchRequested($event)" />
    </app-hero-section>
  </section>

  <section class="home-page__band">
    <div class="home-page__container">
      <div class="home-page__section">
        <app-valuation-section />
      </div>

      @if (hotListings().length) {
        <div class="home-page__section">
          <app-listings-carousel-section
            title="Hot in this area"
            subtitle="Most viewed listings nearby — the lead card rotates so more homes get seen."
            [items]="hotListings()"
            [isHot]="true"
            [browseQueryParams]="hotBrowseQuery()"
          />
        </div>
      }

      <div class="home-page__section">
        <app-agents-section [items]="agents()" />
      </div>

      <div class="home-page__section">
        <app-promo-section
          title="The easiest way to find your perfect property."
          description="Search, explore, and connect with trusted agents. LocateHome brings the entire real estate experience to your fingertips."
          [bullets]="appPromoBullets()"
          [featureDescriptions]="appPromoFeatureDescriptions()"
          phoneImageUrl="assets/images/home/mobile-app.png" />
      </div>
    </div>
  </section>
</div>
