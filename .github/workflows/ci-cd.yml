name: Frontend DEV CI/CD

on:
  push:
    branches: [Development]

jobs:
  build-and-stage:
    name: Build & Stage
    runs-on: [self-hosted, windows, property-frontend-self-hosted]

    steps:
      - name: Clone repository
        shell: powershell
        run: |
          $repoPath = "$env:GITHUB_WORKSPACE"
          if (Test-Path $repoPath) {
            Remove-Item "$repoPath\*" -Recurse -Force -ErrorAction SilentlyContinue
          }
          git clone --branch Development --depth 1 --single-branch `
            https://x-access-token:${{ secrets.GH_TOKEN_PROP_FRONT }}@github.com/haris412/LocateHome.git `
            $repoPath

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        shell: powershell
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: frontend
        shell: powershell
        run: npm run build -- --configuration production

      - name: Copy build to staging folder
        shell: powershell
        run: |
          $source      = "frontend\dist\frontend"
          $destination = "C:\property-frontend-dev-temp"

          if (!(Test-Path $source)) {
            Write-Error "Build output not found at $source"
            exit 1
          }

          if (!(Test-Path $destination)) {
            New-Item -ItemType Directory -Path $destination -Force
          }

          Remove-Item "$destination\*" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$source\*" -Destination $destination -Recurse -Force

          Write-Host "Build copied to $destination"
