name: Frontend DEV CI/CD

on:
  push:
    branches: [Development]

jobs:
  build-and-stage:
    name: Build & Stage
    runs-on: [self-hosted, windows, property-frontend-self-hosted]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        shell: powershell
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: frontend
        shell: powershell
        run: npm run build -- --configuration production

      - name: Copy build to staging folder
        shell: powershell
        run: |
          $source      = "frontend\dist\frontend"
          $destination = "C:\property-frontend-dev-temp"

          if (!(Test-Path $source)) {
            Write-Error "Build output not found at $source"
            exit 1
          }

          if (!(Test-Path $destination)) {
            New-Item -ItemType Directory -Path $destination -Force
          }

          Remove-Item "$destination\*" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$source\*" -Destination $destination -Recurse -Force

          Write-Host "Build copied to $destination"
