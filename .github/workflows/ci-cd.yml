name: Frontend DEV CI/CD

on:
  push:
    branches: [Development]

jobs:
  build-and-stage:
    name: Build & Stage
    runs-on: [self-hosted, windows, property-frontend-self-hosted]

    steps:
      - name: Clone or update repository
        shell: powershell
        run: |
          $repoPath = "$env:GITHUB_WORKSPACE"
          $remote   = "https://x-access-token:${{ secrets.GH_TOKEN_PROP_FRONT }}@github.com/haris412/LocateHome.git"

          if (Test-Path "$repoPath\.git") {
            Write-Host "Repo exists — fetching latest"
            git -C $repoPath remote set-url origin $remote
            git -C $repoPath fetch --depth 1 origin Development
            git -C $repoPath reset --hard origin/Development
            git -C $repoPath clean -fd
          } else {
            Write-Host "No repo found — cloning"
            if (!(Test-Path $repoPath)) {
              New-Item -ItemType Directory -Path $repoPath -Force | Out-Null
            }
            git clone --branch Development --depth 1 --single-branch $remote $repoPath
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        shell: powershell
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: frontend
        shell: powershell
        run: npm run build -- --configuration production

      - name: Patch index.html base href
        shell: powershell
        run: |
          $indexPath = "$env:GITHUB_WORKSPACE\frontend\dist\frontend\browser\index.html"
          if (!(Test-Path $indexPath)) {
            Write-Error "index.html not found at $indexPath"
            exit 1
          }
          (Get-Content $indexPath -Raw) -replace '<base href="/">', '<base href="/property.web/">' |
            Set-Content $indexPath -Encoding utf8
          Write-Host "base href patched"

      - name: Deploy (blue-green swap)
        shell: powershell
        run: |
          Import-Module WebAdministration

          $siteName  = "Default Web Site"
          $appName   = "property.web"
          $appPath   = "IIS:\Sites\$siteName\$appName"
          $pathA     = "C:\inetpub\property.web\browser"
          $pathB     = "C:\property-frontend-dev-temp"
          $source    = "$env:GITHUB_WORKSPACE\frontend\dist\frontend\browser"

          if (!(Test-Path $source)) {
            Write-Error "Build output not found at $source"
            exit 1
          }

          $app = Get-WebApplication -Site $siteName -Name $appName
          if (!$app) {
            Write-Error "IIS application '$appName' not found under '$siteName'"
            exit 1
          }

          $currentPath = $app.PhysicalPath.TrimEnd('\')
          Write-Host "Current IIS physical path: $currentPath"

          if ($currentPath -eq $pathA) {
            Write-Host "Currently on A — deploying to B ($pathB)"
            $target = $pathB
          } else {
            Write-Host "Currently on B — deploying to A ($pathA)"
            $target = $pathA
          }

          if (!(Test-Path $target)) {
            New-Item -ItemType Directory -Path $target -Force
          }

          Remove-Item "$target\*" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "$source\*" -Destination $target -Recurse -Force
          Write-Host "Build copied to $target"

          Set-ItemProperty $appPath -Name physicalPath -Value $target
          Write-Host "IIS physical path updated to $target"

          Restart-WebAppPool -Name (Get-WebApplication -Site $siteName -Name $appName).applicationPool
          Write-Host "App pool restarted"
